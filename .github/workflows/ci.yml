name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  no-std:
    name: no_std check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Check core crates (host, --no-default-features)
        run: >
          cargo check
          -p he3d -p he3d-math -p he3d-core -p he3d-renderer
          -p he3d-assets -p he3d-physics -p he3d-platform
          --no-default-features
      - name: Check core crates (bare-metal target)
        run: >
          cargo check
          -p he3d -p he3d-math -p he3d-core -p he3d-renderer
          -p he3d-assets -p he3d-physics -p he3d-platform
          --no-default-features --target x86_64-unknown-none

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install SDL3 (build from source; libsdl3-dev is not in Ubuntu 24.04 repos)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev
          git clone --depth 1 --branch release-3.2.0 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL/build -j2
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SDL3 (build from source; libsdl3-dev is not in Ubuntu 24.04 repos)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev
          git clone --depth 1 --branch release-3.2.0 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL/build -j2
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig
      - run: cargo test --workspace
      - name: Guide code blocks (he3d-docs compiles them)
        run: cargo check -p he3d-docs

  audit-features:
    name: dependency feature audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify no std leaks into core crates
        run: |
          set -euo pipefail
          for pkg in he3d-renderer he3d-assets he3d-physics he3d; do
            tree=$(cargo tree -p "$pkg" --no-default-features -e features)
            if echo "$tree" | grep -Eq '(^|[^a-z])std($|[^a-z])'; then
              echo "std leak detected in $pkg:"
              echo "$tree"
              exit 1
            fi
          done
          echo "no std leaks detected"
      - name: Verify the engine depends on no backend crate
        run: |
          set -euo pipefail
          # `he3d` must not carry a backend even with every feature on: the binary
          # chooses the backend, so a backend here would decide for it (ADR 0005).
          tree=$(cargo tree -p he3d --all-features -e normal,build,features)
          if echo "$tree" | grep -qE 'he3d-platform-(sdl3|std)'; then
            echo "he3d depends on a backend:"
            echo "$tree"
            exit 1
          fi
          # A dev-dependency would not reach users, but keeping the facade free of
          # one is what lets its test suite build anywhere.
          dev=$(cargo tree -p he3d --all-features -e dev)
          if echo "$dev" | grep -qE 'he3d-platform-(sdl3|std)'; then
            echo "he3d has a backend dev-dependency:"
            echo "$dev"
            exit 1
          fi
          echo "he3d depends on no backend"
