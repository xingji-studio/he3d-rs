[package]
name = "he3d-triangle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Triangle example: a rotating triangle, backend selected by feature"

[[bin]]
name = "triangle"
path = "src/main.rs"

[features]
default = ["sdl3"]
sdl3 = ["he3d/sdl3"]
std = ["he3d/std"]

[dependencies]
he3d = { path = "../../crates/he3d" }
