[package]
name = "he3d-biplane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Biplane demo: OBJ asset loading + lit solid-color rendering, backend selected by feature"

[[bin]]
name = "biplane"
path = "src/main.rs"

[features]
default = ["sdl3"]
sdl3 = ["he3d/sdl3"]
std = ["he3d/std"]

[dependencies]
he3d = { path = "../../crates/he3d" }
