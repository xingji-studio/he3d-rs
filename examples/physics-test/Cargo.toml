[package]
name = "he3d-physics-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PhysicsTest demo: a controllable dynamic cube over a static floor (WASD/space/R), backend selected by feature"

[[bin]]
name = "physics-test"
path = "src/main.rs"

[features]
default = ["sdl3"]
sdl3 = ["he3d/sdl3"]
std = ["he3d/std"]

[dependencies]
he3d = { path = "../../crates/he3d" }
