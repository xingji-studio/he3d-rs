[package]
name = "he3d-flight-simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Flight Simulator demo: streamed procedural terrain, textured biplane, flight controls and chase camera, backend selected by feature"

[[bin]]
name = "flight-simulator"
path = "src/main.rs"

[features]
default = ["sdl3"]
sdl3 = ["he3d/sdl3"]
std = ["he3d/std"]

[dependencies]
he3d = { path = "../../crates/he3d" }
