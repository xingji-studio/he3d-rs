[package]
name = "he3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HE3D: a no_std software 3D renderer, scene graph, assets, and physics (backends are separate crates)"
keywords = ["renderer", "3d", "engine", "software", "rasterizer"]
categories = ["game-engines", "graphics"]

[features]
# `std` means one thing only: compile the library crates with `std`. It never
# selects a backend. A backend is a crate the binary depends on and names in
# `main`; see `docs/adr/0005`.
# `std` 只有一个含义：给各库 crate 开 `std`。它从不选后端。后端是二进制自己依赖、
# 并在 `main` 里点名的 crate；见 `docs/adr/0005`。
default = []
std = [
    "he3d-math/std",
    "he3d-core/std",
    "he3d-renderer/std",
    "he3d-assets/std",
    "he3d-physics/std",
    "he3d-platform/std",
]
# Asset-format features forward to `he3d-assets`. BMP is always enabled
# (the facade re-enables it explicitly because the workspace dependency sets
# `default-features = false`); PNG/JPEG/glTF are opt-in so `no_std` builds stay
# minimal by default.
# 资源格式特性转发到 `he3d-assets`。BMP 始终启用（工作区依赖设置了
# `default-features = false`，因此门面需显式重新启用）；PNG/JPEG/glTF 按需开启，
# 使 `no_std` 构建默认保持最小。
png = ["he3d-assets/png"]
jpeg = ["he3d-assets/jpeg"]
gltf = ["he3d-assets/gltf"]

[dependencies]
he3d-math = { workspace = true }
he3d-core = { workspace = true }
he3d-renderer = { workspace = true }
he3d-assets = { workspace = true, features = ["bmp"] }
he3d-physics = { workspace = true }
he3d-platform = { workspace = true }
# No backend crate appears here, optionally or otherwise. Depending on the SDL3
# backend would make SDL3 a build requirement for everyone who depends on `he3d`.
# 此处不出现任何后端 crate，可选依赖也不出现。依赖 SDL3 后端会让每个依赖 `he3d` 的人
# 都必须先有 SDL3。

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["std", "png", "jpeg", "gltf"]
