[package]
name = "he3d-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["renderer", "rasterizer", "software", "3d", "graphics"]
categories = ["graphics", "game-engines"]
description = "no_std + alloc software rasterizer and post-processing"

[features]
default = []
std = ["he3d-core/std", "he3d-math/std"]

[dependencies]
he3d-core = { workspace = true, default-features = false }
he3d-math = { workspace = true, default-features = false }

[lints]
workspace = true
