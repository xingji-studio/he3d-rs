[package]
name = "he3d-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["physics", "3d", "collision", "solver"]
categories = ["game-engines", "mathematics"]
description = "no_std + alloc physics world (gp3d integration)"

[features]
default = []
std = ["he3d-core/std"]

[dependencies]
he3d-core = { workspace = true, default-features = false }
he3d-math = { workspace = true, default-features = false }
# gp3d is a separate package (../gp3d-rs); it must be published to crates.io
# (version 0.1.0) before he3d-physics, and the `version` here mirrors it.
# gp3d 是独立包（../gp3d-rs）；he3d-physics 发布前必须先发布 gp3d 0.1.0，此处的 `version` 与之对应。
gp3d = { path = "../../../gp3d-rs", version = "0.2.0" }

[lints]
workspace = true
