[package]
name = "he3d-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["physics", "3d", "collision", "solver"]
categories = ["game-engines", "mathematics"]
description = "no_std + alloc rigid-body physics: broadphase, contact generation, sequential-impulse solver"

[features]
default = []
std = ["he3d-math/std"]

[dependencies]
# Physics deliberately depends only on the math layer. It knows nothing about
# `he3d-core`, `Scene`, or rendering; see `docs/adr/0001`.
# 物理刻意只依赖数学层。它对 `he3d-core`、`Scene` 与渲染一无所知；见 `docs/adr/0001`。
he3d-math = { workspace = true, default-features = false }

[lints]
workspace = true
