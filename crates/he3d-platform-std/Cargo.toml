[package]
name = "he3d-platform-std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "std backend: standard-output (stdout) framebuffer presentation, filesystem, clock, and test host"

[features]
default = ["std"]
std = ["he3d-platform/std", "he3d-renderer/std", "he3d-assets/std"]

[dependencies]
he3d-platform = { workspace = true, default-features = false }
he3d-renderer = { workspace = true, default-features = false }
he3d-assets = { workspace = true, default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
